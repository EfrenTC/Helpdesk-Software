# Nombre de la app
spring.application.name=helpdesk-software

# ===============================
# H2 Database Config
# ===============================
spring.datasource.url=jdbc:h2:mem:helpdeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear y actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Mostrar las queries SQL en consola (útil para debug)
spring.jpa.show-sql=true

# ===============================
# Consola Web de H2
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.defer-datasource-initialization=true
# spring.sql.init.mode=never
    